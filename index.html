<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Gear Guard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div style="display: flex; align-items: center; gap: 12px;">
    <img src="logo.png" alt="Logo" style="height: 32px;">
    <div class="brand">GEAR GUARD</div>
  </div>

  <nav class="nav">
    <a href="index.html" class="active">Dashboard</a>
    <a href="equipment.html">Equipment</a>
    <a href="maintenance.html">Maintenance</a>
    <a href="kanban.html">Kanban</a>
  </nav>
</header>

<div class="dashboard-grid">
  
  <main>
    <div class="metrics-row">
      <div class="card">
        <h3>Total Equipment</h3>
        <div class="value" id="eqCount">0</div>
      </div>
      <div class="card">
        <h3>Open Requests</h3>
        <div class="value" id="mntCount">0</div>
      </div>
      <div class="card">
        <h3>Pending Tasks</h3>
        <div class="value" id="kbCount">0</div>
      </div>
    </div>

    <div class="card analytics-card">
      <div style="display:flex; justify-content:space-between;">
        <h3>Analytical Report</h3>
        <select id="chartFilter" onchange="renderChart()" style="background:#020617; color:#fff; border:none; padding:5px; border-radius:5px;">
          <option value="activity">Recent Activity</option>
          <option value="health">Equipment Health</option>
        </select>
      </div>
      <canvas id="analyticsChart"></canvas>
    </div>
  </main>

  <aside>
    <div class="calendar-widget">
      <div class="calendar-header">
        <span id="monthName">December 2025</span>
        <div style="font-size:12px; opacity:0.7;">Maintenance Schedule</div>
      </div>
      
      <div class="calendar-grid" id="calendarGrid">
        </div>
    </div>
    
    <div style="margin-top: 20px;">
      <h4 style="color: #94a3b8; margin-bottom:10px;">Quick Actions</h4>
      <button onclick="window.location.href='maintenance.html'" style="width:100%; padding:12px; margin-bottom:8px; background:#1e293b; border:none; color:#cbd5f5; border-radius:8px; text-align:left; cursor:pointer;">
        + New Maintenance Request
      </button>
      <button onclick="window.location.href='kanban.html'" style="width:100%; padding:12px; background:#1e293b; border:none; color:#cbd5f5; border-radius:8px; text-align:left; cursor:pointer;">
        + Add Kanban Task
      </button>
    </div>
  </aside>

</div>

<script src="script.js"></script>
</body>
</html>
